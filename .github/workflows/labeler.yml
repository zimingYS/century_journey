name: PR Labeler

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Apply labels
    runs-on: ubuntu-latest

    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v7
        with:
          sync-labels: true